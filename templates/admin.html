<!DOCTYPE html>
<html>
<head>

    <title>Admin Panel</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>
<body style="background-color:#111; color:white;">

<div class="container mt-5">

    <h2 class="mb-4">🛠 Admin Panel</h2>

    <a href="/" class="btn btn-secondary mb-4">
        ⬅ Back to Home
    </a>

    <!-- ============================
         CREATE NEW USER FORM
    ============================= -->

    <div class="card p-4 mb-5" style="background-color:#1c1c1c;">

        <h4 class="mb-3">➕ Create New User</h4>

        <form method="POST" action="/admin/create_user">

            <div class="mb-3">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input
                    type="text"
                    name="password"
                    class="form-control"
                    required>
            </div>

            <label class="mb-2">Allowed Use-Cases:</label>

            <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="permissions"
                    value="fabric_comparison"
                    id="perm1">
                <label class="form-check-label" for="perm1">
                    Fabric Comparison
                </label>
            </div>

            <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="permissions"
                    value="live_quality"
                    id="perm2">
                <label class="form-check-label" for="perm2">
                    Live Quality Inspection
                </label>
            </div>

            <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="permissions"
                    value="recipe_extraction"
                    id="perm3">
                <label class="form-check-label" for="perm3">
                    Recipe Extraction
                </label>
            </div>

            <div class="form-check mb-3">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="permissions"
                    value="ai_reports"
                    id="perm4">
                <label class="form-check-label" for="perm4">
                    AI Reports
                </label>
            </div>

            <button type="submit" class="btn btn-success">
                Create User
            </button>

        </form>

    </div>

    <!-- ============================
         EXISTING USERS LIST
    ============================= -->

    <h4 class="mb-3">👥 Existing Users</h4>

    <table class="table table-dark table-bordered">

        <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Permissions</th>
        </tr>

        {% for user in users %}

        <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.role }}</td>
            <td>{{ user.permissions }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
