<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Reports</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body style="background:#0f172a; color:white;">

<div class="container py-5">

    <h1 class="mb-5 text-center">

        📑 AI Generated Reports

    </h1>

    {% if reports %}

        <div class="row g-4">

        {% for report in reports %}

            <div class="col-md-6">

                <div class="card bg-dark text-light p-4 rounded-4 shadow">

                    <h5 class="mb-3">

                        {{ report }}

                    </h5>

                    <!-- DOWNLOAD -->

                    <a
                        href="/download_saved_report/{{ report }}"
                        class="btn btn-primary mb-3">

                        Download Report

                    </a>

                    <!-- DELETE -->

                    <a
                        href="/delete_report/{{ report }}"
                        class="btn btn-danger mb-3">

                        Delete Report

                    </a>

                    <!-- RENAME -->

                    <form
                        action="/rename_report"
                        method="POST">

                        <input
                            type="hidden"
                            name="old_name"
                            value="{{ report }}">

                        <input
                            type="text"
                            name="new_name"
                            class="form-control mb-3"
                            placeholder="Rename Report">

                        <button
                            class="btn btn-warning w-100">

                            Rename Report

                        </button>

                    </form>

                </div>

            </div>

        {% endfor %}

        </div>

    {% else %}

        <div class="text-center">

            <h4>

                No AI reports generated yet.

            </h4>

        </div>

    {% endif %}

</div>

</body>
</html>
