<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Inspection History
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <script
        src="{{ url_for('static',
        filename='js/theme.js') }}">
    </script>

</head>

<body>

<div class="container mt-5">

    <h1 class="fw-bold mb-4">

        📜 Inspection History

    </h1>

    <div class="card shadow-lg border-0">

        <div class="card-body p-4">

            <table class="table table-hover history-table">

                <thead>

                    <tr>
                        <th>COMP ID</th>

                        <th>Time</th>

                        <th>Reference</th>

                        <th>Test</th>

                        <th>Delta E</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

                    {% for item in history %}

                    <tr>

                        <td>
                            {{ item.comp_id }}
                        </td>

                        <td>
                            {{ item.time }}
                        </td>

                        <td>
                            {{ item.reference }}
                        </td>

                        <td>
                            {{ item.test }}
                        </td>

                        <td>
                            {{ item.delta_e }}
                        </td>

                        <td>

                            {% if item.status == "PASS" %}

                                <span class="badge bg-success">

                                    APPROVED

                                </span>

                            {% else %}

                                <span class="badge bg-danger">

                                    REJECTED

                                </span>

                            {% endif %}

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
