{% extends "base.html" %}
{% block title %}Select Region{% endblock %}
{% block content %}
<div class="card" style="max-width:700px;margin:0 auto;">
  <h2 class="card-title">Select the fabric region</h2>
  <p class="text-muted mb-4">Drag a box over the denim area you want the AI to analyze.</p>

  <form method="POST" action="{{ analyze_url }}" id="roiForm">
    <div class="roi-frame" id="frame">
      <img id="img" src="{{ image_url }}" alt="Sample">
      <div class="roi-box hidden" id="box"></div>
    </div>
    <div class="roi-status" id="status">Drag on the image to select a region.</div>
    <input type="hidden" name="roi_x" id="x">
    <input type="hidden" name="roi_y" id="y">
    <input type="hidden" name="roi_w" id="w">
    <input type="hidden" name="roi_h" id="h">

    <button type="submit" class="btn btn-primary btn-lg btn-block mt-4" id="submitBtn">
      🎨 Generate AI Recipe
    </button>
    <div id="loadingState" class="loading-overlay hidden">
      <div class="spinner"></div>
      <span>Estimating dye composition…</span>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/roi_selector.js') }}"></script>
<script>
  window.addEventListener("load", () => {
    initRoiSelector({
      frameId: "frame", imgId: "img", boxId: "box", statusId: "status",
      xId: "x", yId: "y", wId: "w", hId: "h",
    });
  });

  document.getElementById("roiForm").addEventListener("submit", (e) => {
    if (!document.getElementById("w").value) {
      e.preventDefault();
      alert("Please select a region on the image first.");
      return;
    }
    document.getElementById("submitBtn").disabled = true;
    document.getElementById("loadingState").classList.remove("hidden");
  });
</script>
{% endblock %}
